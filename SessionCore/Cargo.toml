[package]
name = "ai-access-session-core"
version = "0.11.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/BigPizzaV3/CodexPlusPlus"
description = "Transactional Codex Desktop session visibility sidecar for AI Access Assistant"
publish = false

[package.metadata.upstream]
name = "CodexPlusPlus"
version = "1.2.41"
commit = "3dafffcafb2566a1e8bce4b35671656d6adb3eda"
license = "AGPL-3.0-only"

[lib]
name = "ai_access_session_core"
path = "src/lib.rs"

[[bin]]
name = "ai-access-session-core"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
libc = "0.2"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
